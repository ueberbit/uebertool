minimumReleaseAgeExcludePrune: true
trustPolicy: no-downgrade
shamefullyHoist: true
shellEmulator: true
engineStrict: true

packages:
  - 'packages/*'
  - 'drupal/web/themes/custom/ueberbit/*'
  - drupal/web/themes/custom/uebertool_docs

overrides:
  # web-component-analyzer 2.0.0 pins typescript ~5.2, whose CJS build exposes
  # no named ESM exports; its ESM build imports them (e.g. TypeFormatFlags).
  web-component-analyzer>typescript: 'catalog:'

allowBuilds:
  '@parcel/watcher': true
  esbuild: true

catalog:
  '@antfu/eslint-config': ^10.0.0
  '@shikijs/langs': ^4.6.0
  '@shikijs/themes': ^4.6.0
  '@tailwindcss/node': ^4.3.5
  '@tailwindcss/vite': ^4.3.5
  '@types/fs-extra': ^11.0.4
  '@types/node': ^26.6.6
  '@vitejs/devtools': ^0.8.0
  '@vitejs/devtools-kit': ^0.8.0
  '@vitejs/plugin-vue': ^6.0.11
  '@vue/shared': ^3.5.46
  '@vueuse/core': ^15.0.0
  alpinejs: ^3.17.5
  axe-core: ^4.13.0
  bumpp: ^12.3.0
  defu: ^6.1.7
  eslint: ^10.15.0
  fs-extra: ^11.4.1
  lit: ^3.3.3
  magic-string: ^1.4.5
  morphdom: ^2.7.8
  obuild: ^0.4.45
  pathe: ^2.0.3
  preact: ^11.2.0
  rollup: ^4.68.8
  shiki: ^4.6.0
  stylelint: 18.1.0
  stylelint-config-recess-order: ^7.10.1
  stylelint-config-standard: 41.1.0
  stylelint-order: ^8.1.3
  tailwindcss: ^4.3.5
  tinyglobby: ^0.2.17
  typescript: ^6.0.3
  unimport: ^7.0.3
  unplugin-vue-components: ^32.1.0
  vite: ^8.3.8
  vue: ^3.5.46
  web-component-analyzer: ^2.0.0
  yaml: ^2.9.1
