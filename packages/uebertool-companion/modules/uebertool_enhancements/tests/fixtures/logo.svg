<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 10 10" onload="alert(1)">
  <script>alert(2)</script>
  <foreignObject><div>x</div></foreignObject>
  <a xlink:href="javascript:alert(3)"><rect width="10" height="10" fill="red"/></a>
  <a><animate attributeName="href" values="javascript:alert(4)"/></a>
  <set attributeName="onmouseover" to="alert(5)"/>
  <a><set attributeName="xlink:href" to="https://evil.example.com"/></a>
  <circle cx="5" cy="5" r="{{ 7*7 }}"/>
</svg>
