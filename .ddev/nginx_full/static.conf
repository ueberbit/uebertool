# Serves the static docs export (drupal/scripts/export-docs.sh) like GitHub
# Pages does: https://static.uebertool.localhost/uebertool/
# Needs additional_hostnames: ["static.uebertool"] in config.yaml.
server {
    root /var/www/html/drupal/html;
    server_name static.uebertool.localhost;

    listen 80;
    listen 443 ssl;

    ssl_certificate /etc/ssl/certs/master.crt;
    ssl_certificate_key /etc/ssl/certs/master.key;

    index index.html;
    sendfile off;
    error_log /dev/stdout info;
    access_log /var/log/nginx/access.log;

    location / {
        # Relative redirects for missing trailing slashes, so they stay on
        # https behind the DDEV router.
        absolute_redirect off;
        try_files $uri $uri/ =404;
    }
}
